<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" width="600" height="820">
  <title>Der kleine Baudentroll – Entwurf</title>
  <defs>
    <pattern id="karo" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f4ede0"/>
      <rect width="8" height="16" fill="#c0392b" opacity=".55"/>
      <rect width="16" height="8" fill="#c0392b" opacity=".55"/>
    </pattern>
    <radialGradient id="papier" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#fbf5e8"/><stop offset="1" stop-color="#eadcc0"/>
    </radialGradient>
    <radialGradient id="kopf" cx="45%" cy="38%" r="65%">
      <stop offset="0" stop-color="#d8cbb0"/><stop offset="1" stop-color="#b3a283"/>
    </radialGradient>
    <radialGradient id="licht" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76e" stop-opacity=".9"/><stop offset="1" stop-color="#ffd76e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jeans" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6f99"/><stop offset="1" stop-color="#3d5a80"/>
    </linearGradient>
  </defs>

  <rect width="600" height="820" fill="url(#papier)"/>
  <g fill="#c8d3df">
    <circle cx="60" cy="90" r="5"/><circle cx="530" cy="70" r="6"/><circle cx="110" cy="230" r="4"/>
    <circle cx="500" cy="210" r="4"/><circle cx="70" cy="420" r="5"/><circle cx="545" cy="470" r="5"/>
    <circle cx="150" cy="40" r="3"/><circle cx="440" cy="40" r="4"/>
  </g>

  <!-- Schnee und Schatten -->
  <ellipse cx="300" cy="745" rx="230" ry="34" fill="#ffffff" opacity=".9"/>
  <ellipse cx="300" cy="742" rx="120" ry="14" fill="#8a7a66" opacity=".25"/>

  <!-- Laterne (Licht hinten) -->
  <circle cx="176" cy="660" r="70" fill="url(#licht)"/>

  <!-- Füße, barfuß und behaart -->
  <g stroke="#5c4330" stroke-width="3" stroke-linecap="round">
    <ellipse cx="252" cy="724" rx="50" ry="22" fill="#c2b192"/>
    <ellipse cx="348" cy="724" rx="50" ry="22" fill="#c2b192"/>
  </g>
  <g fill="#cfc0a2" stroke="#5c4330" stroke-width="2.5">
    <circle cx="210" cy="732" r="9"/><circle cx="226" cy="738" r="8"/><circle cx="242" cy="741" r="7"/>
    <circle cx="390" cy="732" r="9"/><circle cx="374" cy="738" r="8"/><circle cx="358" cy="741" r="7"/>
  </g>
  <g stroke="#6b5a48" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M232 706 l-6 -10 M246 704 l0 -12 M260 705 l6 -10 M274 708 l8 -8"/>
    <path d="M326 708 l-8 -8 M340 705 l-6 -10 M354 704 l0 -12 M368 706 l6 -10"/>
  </g>

  <!-- Latzhose: Beine -->
  <path d="M214 585 H386 L382 700 H306 L300 640 L294 700 H218 Z" fill="url(#jeans)" stroke="#2c4060" stroke-width="3" stroke-linejoin="round"/>
  <rect x="216" y="684" width="80" height="18" rx="5" fill="#6d8bb3" stroke="#2c4060" stroke-width="3"/>
  <rect x="304" y="684" width="80" height="18" rx="5" fill="#6d8bb3" stroke="#2c4060" stroke-width="3"/>
  <!-- Flicken am Knie -->
  <rect x="325" y="630" width="34" height="30" rx="4" fill="#a3683f" stroke="#5c4330" stroke-width="2.5" transform="rotate(-6 342 645)"/>
  <path d="M327 636 l4 3 M327 652 l4 3 M352 628 l3 4 M354 655 l3 4" stroke="#f4ede0" stroke-width="2" stroke-linecap="round" transform="rotate(-6 342 645)"/>

  <!-- Hemd: Oberkörper -->
  <path d="M228 452 Q300 440 372 452 L392 600 H208 Z" fill="url(#karo)" stroke="#7a2a20" stroke-width="3" stroke-linejoin="round"/>

  <!-- linker Arm (hängt, hält Laterne) -->
  <g transform="translate(228 468) rotate(22)">
    <rect x="-27" y="0" width="54" height="112" rx="27" fill="url(#karo)" stroke="#7a2a20" stroke-width="3"/>
    <rect x="-29" y="94" width="58" height="16" rx="8" fill="#f4ede0" stroke="#7a2a20" stroke-width="2.5"/>
  </g>
  <!-- Laterne -->
  <path d="M182 604 L176 628" stroke="#3b3b3b" stroke-width="4" fill="none"/>
  <path d="M164 632 Q176 618 188 632" stroke="#3b3b3b" stroke-width="4" fill="none"/>
  <rect x="158" y="632" width="36" height="12" rx="3" fill="#3b3b3b"/>
  <rect x="161" y="644" width="30" height="40" rx="4" fill="#ffd76e" stroke="#3b3b3b" stroke-width="4"/>
  <path d="M176 652 q6 10 0 18 q-6 -8 0 -18" fill="#f39c12"/>
  <rect x="156" y="684" width="40" height="9" rx="3" fill="#3b3b3b"/>
  <!-- linke Hand, pelzig -->
  <circle cx="186" cy="594" r="25" fill="#c2b192" stroke="#5c4330" stroke-width="3"/>
  <path d="M168 582 l-8 -6 M166 596 l-10 0 M172 608 l-7 7" stroke="#6b5a48" stroke-width="3" stroke-linecap="round"/>

  <!-- rechter Arm (winkt) -->
  <g transform="translate(378 470) rotate(-125)">
    <rect x="-27" y="0" width="54" height="125" rx="27" fill="url(#karo)" stroke="#7a2a20" stroke-width="3"/>
    <rect x="-29" y="107" width="58" height="16" rx="8" fill="#f4ede0" stroke="#7a2a20" stroke-width="2.5"/>
  </g>
  <!-- rechte Hand, winkend -->
  <g stroke="#5c4330" stroke-width="3" fill="#c2b192" transform="translate(486 392)">
    <ellipse cx="-8" cy="-34" rx="10" ry="20" transform="rotate(-15 -8 -34)"/>
    <ellipse cx="12" cy="-33" rx="10" ry="20" transform="rotate(12 12 -33)"/>
    <ellipse cx="29" cy="-18" rx="9" ry="18" transform="rotate(48 29 -18)"/>
    <ellipse cx="-28" cy="-8" rx="9" ry="16" transform="rotate(-70 -28 -8)"/>
    <circle cx="0" cy="0" r="27"/>
  </g>
  <path d="M470 416 l-5 9 M486 420 l0 10 M501 414 l5 8" stroke="#6b5a48" stroke-width="3" stroke-linecap="round"/>

  <!-- Latz mit Taschen und Trägern -->
  <path d="M248 505 H352 V600 H248 Z" fill="url(#jeans)" stroke="#2c4060" stroke-width="3" stroke-linejoin="round"/>
  <path d="M272 525 H328 V560 Q300 572 272 560 Z" fill="#577aa6" stroke="#2c4060" stroke-width="2.5"/>
  <path d="M276 532 H324" stroke="#e8c26a" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M250 507 L236 456" stroke="#3d5a80" stroke-width="16" stroke-linecap="round"/>
  <path d="M350 507 L364 456" stroke="#3d5a80" stroke-width="16" stroke-linecap="round"/>
  <circle cx="254" cy="512" r="7" fill="#e8c26a" stroke="#8a6d2f" stroke-width="2"/>
  <circle cx="346" cy="512" r="7" fill="#e8c26a" stroke="#8a6d2f" stroke-width="2"/>

  <!-- große runde Ohren -->
  <g stroke="#5c4c3a" stroke-width="3">
    <ellipse cx="168" cy="335" rx="42" ry="50" fill="#c7b796"/>
    <path d="M178 305 Q150 318 160 345 Q168 365 185 360" fill="none" stroke="#8f7f63" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="432" cy="335" rx="42" ry="50" fill="#c7b796"/>
    <path d="M422 305 Q450 318 440 345 Q432 365 415 360" fill="none" stroke="#8f7f63" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- großer kahler Kopf -->
  <ellipse cx="300" cy="318" rx="140" ry="152" fill="url(#kopf)" stroke="#5c4c3a" stroke-width="3.5"/>
  <ellipse cx="258" cy="212" rx="46" ry="20" fill="#fff" opacity=".35" transform="rotate(-15 258 212)"/>
  <!-- ein paar Härchen an den Seiten -->
  <!-- Stirnfalten -->
  <g stroke="#8f7f63" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M238 228 Q300 212 362 228"/>
    <path d="M228 248 Q300 232 372 248"/>
    <path d="M246 266 Q300 254 354 266"/>
  </g>
  <!-- buschige, gütige Augenbrauen -->
  <path d="M214 294 Q244 274 280 280" stroke="#5a4a3a" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M320 280 Q356 274 386 294" stroke="#5a4a3a" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Augen mit schweren Lidern -->
  <g stroke="#3a2e22" stroke-width="3">
    <ellipse cx="250" cy="318" rx="27" ry="22" fill="#fffdf6"/>
    <ellipse cx="350" cy="318" rx="27" ry="22" fill="#fffdf6"/>
  </g>
  <circle cx="254" cy="324" r="13" fill="#6a7f8c"/><circle cx="346" cy="324" r="13" fill="#6a7f8c"/>
  <circle cx="255" cy="325" r="7" fill="#1f1a14"/><circle cx="345" cy="325" r="7" fill="#1f1a14"/>
  <circle cx="259" cy="321" r="3.5" fill="#fff"/><circle cx="349" cy="321" r="3.5" fill="#fff"/>
  <path d="M221 316 Q250 290 279 316 L279 306 Q250 288 221 306 Z" fill="#bba985" stroke="#3a2e22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M321 316 Q350 290 379 316 L379 306 Q350 288 321 306 Z" fill="#bba985" stroke="#3a2e22" stroke-width="3" stroke-linejoin="round"/>
  <!-- Tränensäcke und Lachfältchen -->
  <g stroke="#8f7f63" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M230 346 Q250 356 270 346"/><path d="M330 346 Q350 356 370 346"/>
    <path d="M212 312 l-12 -4 M212 324 l-13 2"/><path d="M388 312 l12 -4 M388 324 l13 2"/>
  </g>
  <!-- Bäckchen -->
  <circle cx="218" cy="372" r="24" fill="#d98b7c" opacity=".35"/>
  <circle cx="382" cy="372" r="24" fill="#d98b7c" opacity=".35"/>
  <!-- breite Nase -->
  <path d="M286 312 Q282 345 268 362 Q262 384 286 386 Q300 394 314 386 Q338 384 332 362 Q318 345 314 312"
        fill="#bca783" stroke="#5c4c3a" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="300" cy="366" rx="14" ry="10" fill="#d8c8a8" opacity=".7"/>
  <path d="M280 380 q6 4 10 0 M310 380 q4 4 10 0" stroke="#5c4c3a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Wangenfalten -->
  <path d="M262 372 Q242 398 250 420" stroke="#8f7f63" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M338 372 Q358 398 350 420" stroke="#8f7f63" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- dunkler Bart um Mund und Kinn -->
  <path d="M248 400 Q262 392 300 396 Q338 392 352 400 Q364 432 344 456 Q326 476 300 478 Q274 476 256 456 Q236 432 248 400 Z"
        fill="#5a4c3e" stroke="#3e3328" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#7a6a58" stroke-width="2.5" stroke-linecap="round">
    <path d="M262 430 l4 12 M278 446 l2 12 M300 452 l0 13 M322 446 l-2 12 M338 430 l-4 12"/>
  </g>
  <!-- Schnurrbart und freundlicher Mund -->
  <path d="M262 402 Q282 392 300 402 Q318 392 338 402 Q326 414 300 408 Q274 414 262 402 Z" fill="#4a3e32"/>
  <path d="M266 414 Q300 450 334 414 Q300 424 266 414 Z" fill="#7a3b2e" stroke="#2e241a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M272 417 Q300 426 328 417 L326 422 Q300 430 274 422 Z" fill="#fffdf6"/>

  <text x="300" y="800" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#5a3e2b">Der kleine Baudentroll</text>
</svg>
